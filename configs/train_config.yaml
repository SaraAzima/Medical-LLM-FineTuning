# ClinReason-2B training configuration
project_name: clinreason-2b

model:
  base_model: google/gemma-2-2b-it
  max_seq_length: 2048
  load_in_4bit: true
  dtype: null   # let unsloth auto-select (bf16 on Ampere+, fp16 otherwise)

lora:
  r: 16
  lora_alpha: 16
  lora_dropout: 0.05
  bias: "none"
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  use_gradient_checkpointing: "unsloth"
  random_state: 42

data:
  train_file: data/processed/train.jsonl
  val_file: data/processed/val.jsonl
  text_field: text            # pre-formatted chat-templated field
  packing: false               # keep false for clean loss-masking per example

training:
  output_dir: outputs/clinreason-2b
  num_train_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 8   # effective batch size = 32
  per_device_eval_batch_size: 4
  eval_strategy: steps
  eval_steps: 200
  save_strategy: steps
  save_steps: 200
  save_total_limit: 3
  logging_steps: 10
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.01
  optim: adamw_8bit
  seed: 42
  bf16: true
  fp16: false
  report_to: "none"            # set to "wandb" if you have it configured

generation:
  max_new_tokens: 512
  temperature: 0.3
  top_p: 0.9
  do_sample: true

prompt:
  system_instruction: >
    You are a careful clinical reasoning assistant. Given a medical
    question or patient case, think step by step through the relevant
    history, findings, and differential considerations inside a
    <reasoning>...</reasoning> block, then give a concise final answer
    inside an <answer>...</answer> block. Never state clinical facts you
    are not confident about; if uncertain, say so explicitly.
